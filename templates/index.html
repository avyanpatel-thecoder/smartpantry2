<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pantry & AI Recipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-emerald-900 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">🌿 Smart Pantry</h1>
            <div class="flex items-center gap-4">
                <span class="text-sm text-emerald-200">Hello, {{ current_user.username }}</span>
                <a href="/logout" class="bg-emerald-800 hover:bg-emerald-700 px-3 py-1.5 rounded text-sm transition">Logout</a>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-200 mb-6 gap-6">
            <button onclick="switchTab('pantry')" id="tab-pantry" class="pb-3 font-semibold text-emerald-900 border-b-2 border-emerald-900 transition">My Pantry</button>
            <button onclick="switchTab('recipes')" id="tab-recipes" class="pb-3 font-semibold text-slate-500 hover:text-emerald-900 transition">AI Recipes</button>
            <button onclick="switchTab('scanner')" id="tab-scanner" class="pb-3 font-semibold text-slate-500 hover:text-emerald-900 transition">Barcode Scanner</button>
        </div>

        <!-- Tab 1: Pantry View -->
        <section id="section-pantry" class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-sm font-medium text-slate-600 mb-1">Item Name</label>
                    <input type="text" id="itemName" placeholder="e.g. Olive Oil" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-600 focus:outline-none">
                </div>
                <div class="w-32">
                    <label class="block text-sm font-medium text-slate-600 mb-1">Quantity</label>
                    <input type="text" id="itemQty" placeholder="1 bottle" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-600 focus:outline-none">
                </div>
                <div class="w-40">
                    <label class="block text-sm font-medium text-slate-600 mb-1">Category</label>
                    <input type="text" id="itemCat" placeholder="Pantry" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-600 focus:outline-none">
                </div>
                <button onclick="addPantryItem()" class="bg-emerald-800 hover:bg-emerald-900 text-white font-medium px-5 py-2 rounded-lg transition">Add Item</button>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-sm uppercase">
                            <th class="p-4 font-semibold">Name</th>
                            <th class="p-4 font-semibold">Quantity</th>
                            <th class="p-4 font-semibold">Category</th>
                            <th class="p-4 font-semibold text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="pantryTableBody" class="divide-y divide-slate-100">
                        <!-- Dynamic items load here -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Tab 2: Recipes View -->
        <section id="section-recipes" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">AI Chef Assistant</h2>
                    <p class="text-sm text-slate-500">Generate custom recipes based on what is currently in your pantry.</p>
                </div>
                <button onclick="generateRecipe()" id="genBtn" class="bg-emerald-800 hover:bg-emerald-900 text-white font-medium px-5 py-2.5 rounded-lg transition shadow">✨ Generate Recipe</button>
            </div>

            <div id="recipesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Dynamic recipes load here -->
            </div>
        </section>

        <!-- Tab 3: Scanner View -->
        <section id="section-scanner" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 max-w-lg mx-auto text-center space-y-4">
                <h2 class="text-lg font-bold text-slate-800">Scan Barcode (Open Food Facts)</h2>
                <p class="text-sm text-slate-500">Enter a barcode number to instantly look up and add items.</p>
                <input type="text" id="barcodeInput" placeholder="Enter barcode (e.g. 5449000000996)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-center focus:ring-2 focus:ring-emerald-600 focus:outline-none">
                <button onclick="scanBarcode()" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-medium py-2.5 rounded-lg transition">Look Up & Add Item</button>
                <div id="scanResult" class="text-sm font-medium mt-2"></div>
            </div>
        </section>
    </main>

    <!-- JavaScript Logic -->
    <script>
        function switchTab(tab) {
            ['pantry', 'recipes', 'scanner'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('border-b-2', 'border-emerald-900', 'text-emerald-900');
                document.getElementById(`tab-${t}`).classList.add('text-slate-500');
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('border-b-2', 'border-emerald-900', 'text-emerald-900');
            document.getElementById(`tab-${tab}`).classList.remove('text-slate-500');

            if (tab === 'pantry') fetchPantry();
            if (tab === 'recipes') fetchRecipes();
        }

        async function fetchPantry() {
            const res = await fetch('/api/pantry');
            const items = await res.json();
            const tbody = document.getElementById('pantryTableBody');
            tbody.innerHTML = items.length === 0 ? '<tr><td colspan="4" class="p-6 text-center text-slate-400">No items in pantry yet.</td></tr>' : '';
            items.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-4 font-medium">${item.name}</td>
                        <td class="p-4 text-slate-600">${item.quantity}</td>
                        <td class="p-4"><span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full">${item.category}</span></td>
                        <td class="p-4 text-right"><button onclick="deletePantry(${item.id})" class="text-rose-600 hover:text-rose-800 text-sm">Delete</button></td>
                    </tr>
                `;
            });
        }

        async function addPantryItem() {
            const name = document.getElementById('itemName').value;
            const quantity = document.getElementById('itemQty').value || '1 unit';
            const category = document.getElementById('itemCat').value || 'Pantry';
            if (!name) return alert('Please enter an item name.');

            await fetch('/api/pantry', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, quantity, category, expiry_date: '2026-12-31' })
            });

            document.getElementById('itemName').value = '';
            document.getElementById('itemQty').value = '';
            document.getElementById('itemCat').value = '';
            fetchPantry();
        }

        async function deletePantry(id) {
            await fetch(`/api/pantry/${id}`, { method: 'DELETE' });
            fetchPantry();
        }

        async function fetchRecipes() {
            const res = await fetch('/api/recipes');
            const recipes = await res.json();
            const container = document.getElementById('recipesContainer');
            container.innerHTML = recipes.length === 0 ? '<p class="text-slate-400 col-span-2 text-center py-8">No AI recipes generated yet. Click generate above!</p>' : '';
            recipes.forEach(r => {
                container.innerHTML += `
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-3">
                        <h3 class="font-bold text-lg text-emerald-900">${r.title}</h3>
                        <p class="text-sm text-slate-600 whitespace-pre-line">${r.description}</p>
                        <div class="flex gap-4 text-xs text-slate-400 pt-2 border-t border-slate-100">
                            <span>⏱️ ${r.time || '20 mins'}</span>
                            <span>⚡ ${r.difficulty || 'Easy'}</span>
                        </div>
                    </div>
                `;
            });
        }

        async function generateRecipe() {
            const btn = document.getElementById('genBtn');
            btn.innerText = '✨ Generating with AI...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/recipes/generate', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    switchTab('recipes'); // Instantly jump to recipes tab
                }
            } catch (err) {
                alert('Error generating recipe.');
            } finally {
                btn.innerText = '✨ Generate Recipe';
                btn.disabled = false;
            }
        }

        async function scanBarcode() {
            const barcode = document.getElementById('barcodeInput').value;
            const resultDiv = document.getElementById('scanResult');
            if (!barcode) return alert('Enter a barcode.');

            resultDiv.innerText = 'Looking up product...';
            resultDiv.className = 'text-sm font-medium text-slate-500 mt-2';

            const res = await fetch('/api/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ barcode })
            });
            const data = await res.json();

            if (data.success) {
                resultDiv.innerText = data.message;
                resultDiv.className = 'text-sm font-medium text-emerald-600 mt-2';
                document.getElementById('barcodeInput').value = '';
            } else {
                resultDiv.innerText = 'Product not found.';
                resultDiv.className = 'text-sm font-medium text-rose-600 mt-2';
            }
        }

        // Load pantry on initial page load
        fetchPantry();
    </script>
</body>
</html>
